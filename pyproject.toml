[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interpretive-ecology"
version = "0.1.0"
description = "A reproducible minimal experiment in persistent ecological concept formation"
requires-python = ">=3.11"

[project.scripts]
eie-experiment = "interpretive_ecology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
